[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Alexey Nesterenko", email = "comcon1@pm.me"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
]
description = "TODO"
dynamic = ["version"]
keywords = [
    "Test project",
]
license = "GPL-3.0-or-later"
name = "toy_genome_handler"
readme = "README.md"
dependencies = [
    "pytest"
]

[project.urls]
repository = "https://github.com/comcon1/toy_genome_handler"

[project.scripts]
toy_genome_handler = "toy_genome_handler.__main__:main"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = [
    "-ra",
    "--import-mode=append",
]
markers = [
    "unit: run unit tests",
    "integration: run integration tests",
]

[tool.ruff]
target-version = "py310"
# Set the maximum line length to 120
line-length = 120
exclude = ["src/DatabankLib/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
extend-select = ["E501"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# TODO: check and renable these
"**/{tests}/*" = ["D", "E", "F", "B", "I"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"